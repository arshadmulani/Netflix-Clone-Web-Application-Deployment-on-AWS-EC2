<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Netflix</title>
      
      <!-- Netflix Logo in Browser Tab --> 
       <link rel="icon" 
       type="image/png" 
       href="images/Netflix-Symbol.png">
       

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <header>
       <nav class="navbar">

           <!-- LEFT --> 
            <img src="images/Netflix-Symbol.png"
                 alt="Netflix-Symbol"
                 class="logo">
       </nav>

       <!-- RIGHT --> 
        <div class="nav-right"> 
            
            <div class="nav-menu"> 
                <a href="#">Home</a> 
                <a href="#">Movies</a>
                <a href="#">TV Shows</a>
                 <a href="#">Latest</a> 
                 <a href="#">My List</a> 
            </div>

            <div class="search-box"> 
                <input type="text" placeholder="Search"> 
            </div>
        </div>

    </header>


    <!-- HOLLYWOOD -->

    <section class="movie-section">

        <h2>Hollywood</h2>

        <div class="movie-container">


            <!-- Avengers -->

            <div class="movie-card">

                <img
                    src="images/Avengers - 1.jpg"
                    alt="Avengers 2012"
                >

                <h3>Avengers</h3>

            </div>


            <!-- Avengers Age of Ultron -->

            <div class="movie-card">

                <img
                    src="images/Avengers - Age Of Ultron.jpg"
                    alt="Avengers Age of Ultron 2015"
                >

                <h3>Avengers Age Of Ultron</h3>

            </div>
            
              <!-- Venom -->

            <div class="movie-card">

                <img
                    src="images/Venom.jpg"
                    alt="Venom"
                >

                <h3>Venom</h3>

            </div>

            <!-- Venom Let There Be Carnage -->

             <div class="movie-card">

                <img
                    src="images/Venom Let There Be Carnage.jpg"
                    alt="Venom Let There Be Carnage"
                >

                <h3>Venom Let There Be Carnage</h3>

            </div>
            
             <!-- Hitman Agent 47 -->

             <div class="movie-card">

                <img
                    src="images/Hitman Agent 47.jpg"
                    alt="Hitman Agent 47"
                >

                <h3>Hitman Agent 47</h3>

            </div>

        </div>

    </section>



    <!-- BOLLYWOOD -->

    <section class="movie-section">

        <h2>Bollywood</h2>

        <div class="movie-container">


            <!-- Force -->

            <div class="movie-card">

                <img
                    src="images/Force.jpg"
                    alt="Force"
                >

                <h3>Force</h3>

            </div>


            <!-- Khuda Hafiz -->

            <div class="movie-card">

                <img
                    src="images/Khuda Haafiz.jpg"
                    alt="Khuda Haafiz"
                >

                <h3>Khuda Haafiz</h3>

            </div>
            
            <!-- War -->

            <div class="movie-card">

                <img
                    src="images/War.jpg"
                    alt="War"
                >

                <h3>War</h3>

            </div>
            
            <!-- Tiger Zinda Hai -->

             <div class="movie-card">

                <img
                    src="images/Tiger Zinda Hai.jpg"
                    alt="Tiger Zinda Hai"
                >

                <h3>Tiger Zinda Hai</h3>

            </div>

            <!-- Dhurandhar The Revenge -->

            <div class="movie-card">

                <img
                    src="images/Dhurandhar The Revenge.jpg"
                    alt="Dhurandhar The Revenge"
                >

                <h3>Dhurandhar The Revenge</h3>

            </div>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
